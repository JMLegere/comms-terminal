# Slack credentials for universal-inbox.service. Install once Slack is connected (docs/runbook.md §6.6):
#   sudo install -D -m 0644 deploy/universal-inbox.service.d/slack.conf /etc/systemd/system/universal-inbox.service.d/slack.conf
[Service]
LoadCredentialEncrypted=slack-signing-secret:/etc/credstore.encrypted/universal-inbox.slack-signing-secret
LoadCredentialEncrypted=slack-user-token:/etc/credstore.encrypted/universal-inbox.slack-user-token
