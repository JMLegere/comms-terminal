# Slack credentials for comms-terminal.service. Install once Slack is connected (docs/runbook.md §6.6):
#   sudo install -D -m 0644 deploy/comms-terminal.service.d/slack.conf /etc/systemd/system/comms-terminal.service.d/slack.conf
[Service]
LoadCredentialEncrypted=slack-signing-secret:/etc/credstore.encrypted/comms-terminal.slack-signing-secret
LoadCredentialEncrypted=slack-user-token:/etc/credstore.encrypted/comms-terminal.slack-user-token
