# Quo credentials for comms-terminal.service (.agents/discovery/2026-10-12-sms.md). deploy/install.sh
# installs this once the quo-webhook-secret credential exists; until then /hooks/quo answers 503.
[Service]
LoadCredentialEncrypted=quo-webhook-secret:/etc/credstore.encrypted/comms-terminal.quo-webhook-secret
LoadCredentialEncrypted=quo-api-key:/etc/credstore.encrypted/comms-terminal.quo-api-key
