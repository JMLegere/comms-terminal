# Deploy: cd deploy/email-worker && npx wrangler deploy && npx wrangler secret put EMAIL_HOOK_SECRET
name = "comms-terminal-email"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [
  { pattern = "https://hooks.agentmaple.com/hooks/email*", zone_name = "agentmaple.com" },
  { pattern = "https://hooks.agentmaple.com/hooks/slack*", zone_name = "agentmaple.com" },
  { pattern = "https://hooks.agentmaple.com/hooks/quo*", zone_name = "agentmaple.com" },
  { pattern = "https://hooks.agentmaple.com/hooks/resend*", zone_name = "agentmaple.com" },
]

[vars]
HOOK_URL = "https://hooks.agentmaple.com/hooks/email"
# Temporary independent copy during the Oracle migration; remove to restore source-only delivery.
MIRROR_HOOK_URL = "https://hooks-inbox.jmlegere.com/hooks/email"
