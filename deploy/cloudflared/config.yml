# Cloudflare Tunnel for Universal Inbox (D3, decision #102). Copy to /etc/cloudflared/config.yml and replace
# <TUNNEL_ID> with the ID printed by `cloudflared tunnel create universal-inbox`.
# Only the two hook paths are published; everything else on the hostname returns 404.
tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: hooks.agentmaple.com
    path: ^/hooks/(email|slack)$
    service: http://127.0.0.1:8787
  - service: http_status:404
