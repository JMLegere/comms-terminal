# The desktop App on Apple silicon (PRD Phase 7, FR-17): build, test, and draw the demo inbox, so a change that
# breaks macOS shows here before a teammate's Mac. Reads only synthetic data; no secrets.
name: App on macOS

on:
  push:
    paths: ["app/**", "deploy/comms-terminal-app*", "src/comms_terminal/core.py", ".github/workflows/app-macos.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            app/target
          key: app-macos-${{ hashFiles('app/Cargo.lock') }}
      - name: Rust tests
        run: cargo test --release --manifest-path app/Cargo.toml
      - name: Build
        run: cargo build --release --manifest-path app/Cargo.toml
      - name: Views pass check
        run: app/target/release/comms-terminal-app check
      - name: Local core tests
        run: uv run pytest -q tests/test_core.py tests/test_features.py -k "core or app or App"
      - name: Draw the demo inbox
        run: |
          uv run python scripts/seed_demo.py --db "$RUNNER_TEMP/demo.db"
          export COMMS_TERMINAL_CORE="[\"uv\", \"run\", \"--project\", \"$PWD\", \"comms-terminal\", \"--db\", \"$RUNNER_TEMP/demo.db\"]"
          app/target/release/comms-terminal-app > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 60); do app/target/release/comms-terminal-app status > "$RUNNER_TEMP/status.json" 2>/dev/null && break; sleep 2; done
          sleep 5
          app/target/release/comms-terminal-app status
          app/target/release/comms-terminal-app shot "$RUNNER_TEMP/demo.png"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: |
            ${{ runner.temp }}/demo.png
            ${{ runner.temp }}/app.log
