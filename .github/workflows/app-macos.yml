# The desktop App on Linux (Mani) and Apple silicon (PRD Phase 7, FR-17): build, test, and on macOS draw the demo
# inbox and an update, so a change that breaks either shows here first. Reads only synthetic data; no secrets.
# Linux is the check to wait on: its runners start at once. macOS runners sometimes wait 5 to 10 minutes.
# Every push to main publishes the App to the rolling "app-builds" release, which deploy/comms-terminal-app downloads
# instead of compiling (Jeremy, 2026-11-04): so every push runs, whatever it changed.
name: App

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # the app-builds release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # A checkout gives every file a new mtime, so cargo rebuilt all 28 vendored crates on every run even with a
      # warm cache. Vendored files get one fixed mtime; the cache key holds their content hash instead.
      - name: Pin vendored mtimes
        run: find app/vendor -exec touch -h -t 202601010000 {} +
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Linux libraries
        run: sudo apt-get update -q && sudo apt-get install -yq libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libvulkan-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            app/target
          key: app-linux-${{ hashFiles('app/Cargo.lock') }}-${{ hashFiles('app/vendor/**') }}
      - name: Rust tests
        run: cargo test --release --manifest-path app/Cargo.toml
      - name: Build
        run: cargo build --release --manifest-path app/Cargo.toml
      - name: Publish for the launcher
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: comms-terminal-app-${{ github.sha }}-linux-x86_64
        run: |
          cp app/target/release/comms-terminal-app "$ASSET"
          gh release view app-builds >/dev/null 2>&1 || gh release create app-builds --prerelease --title "App builds" \
            --notes "The App for each push to main, downloaded by deploy/comms-terminal-app. Not a release." || true
          gh release upload app-builds "$ASSET" --clobber
          # Keep the newest 60 builds.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/app-builds" --jq '.assets | sort_by(.created_at) | reverse | .[60:] | .[].id' \
            | xargs -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/{}"
      - name: App tests
        run: uv run pytest -q tests/test_core.py tests/test_features.py tests/test_app_launcher.py tests/test_app_bars.py tests/test_app_settings.py tests/test_app_parity.py -k "core or app or App or launcher"

  macos:
    runs-on: macos-15
    permissions:
      contents: write  # the app-builds release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Pin vendored mtimes
        run: find app/vendor -exec touch -h -t 202601010000 {} +
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            app/target
          key: app-macos-${{ hashFiles('app/Cargo.lock') }}-${{ hashFiles('app/vendor/**') }}
      - name: Rust tests
        run: cargo test --release --manifest-path app/Cargo.toml
      - name: Build
        run: cargo build --release --manifest-path app/Cargo.toml
      - name: Publish for the launcher
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: comms-terminal-app-${{ github.sha }}-darwin-arm64
        run: |
          cp app/target/release/comms-terminal-app "$ASSET"
          gh release view app-builds >/dev/null 2>&1 || gh release create app-builds --prerelease --title "App builds" \
            --notes "The App for each push to main, downloaded by deploy/comms-terminal-app. Not a release." || true
          gh release upload app-builds "$ASSET" --clobber
          # Keep the newest 60 builds.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/app-builds" --jq '.assets | sort_by(.created_at) | reverse | .[60:] | .[].id' \
            | xargs -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/{}"
      - name: Views pass check
        run: |
          for view in app/defaults/views/*/; do
            app/target/release/comms-terminal-app check "$HOME/.config/comms-terminal-app/views/$(basename "$view")"
          done
      - name: Local core tests
        # macOS's temp dir is too deep for a Unix socket path (104 bytes); the core's own socket lives in /tmp.
        run: uv run pytest -q --basetemp=/tmp/ct tests/test_core.py tests/test_features.py -k "core or app or App"
      - name: Draw the demo inbox
        run: |
          uv run python scripts/seed_demo.py --db "$RUNNER_TEMP/demo.db"
          export COMMS_TERMINAL_CORE="[\"uv\", \"run\", \"--project\", \"$PWD\", \"comms-terminal\", \"--db\", \"$RUNNER_TEMP/demo.db\"]"
          app/target/release/comms-terminal-app > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 60); do app/target/release/comms-terminal-app status > "$RUNNER_TEMP/status.json" 2>/dev/null && break; sleep 2; done
          sleep 5
          app/target/release/comms-terminal-app status
          app/target/release/comms-terminal-app shot "$RUNNER_TEMP/demo.png"
          pkill -f comms-terminal || true  # the core holds uv's cache lock while it runs
      - name: Draw an update (PRD 2026-11-04-app-update-on-restart)
        # An offline core is read-only; a stand-in --prepare stages for 12 s. The App fades and names the step
        # (building, then ready) and never quits; a second start's `raise` finds the open window.
        run: |
          printf '#!/bin/sh\nsleep 12\n' > "$RUNNER_TEMP/prepare"
          chmod 755 "$RUNNER_TEMP/prepare"
          export COMMS_TERMINAL_APP_PREPARE="$RUNNER_TEMP/prepare"
          export COMMS_TERMINAL_CORE="[\"uv\", \"run\", \"--project\", \"$PWD\", \"comms-terminal\", \"--db\", \"$RUNNER_TEMP/demo.db\", \"--remote\", \"-o BatchMode=yes -o ConnectTimeout=1 nobody@127.0.0.1\"]"
          app/target/release/comms-terminal-app > "$RUNNER_TEMP/app-update.log" 2>&1 &
          for i in $(seq 60); do app/target/release/comms-terminal-app status > /dev/null 2>&1 && break; sleep 2; done
          sleep 5
          app/target/release/comms-terminal-app do app.update
          sleep 2
          app/target/release/comms-terminal-app shot "$RUNNER_TEMP/update-building.png"
          sleep 15
          app/target/release/comms-terminal-app shot "$RUNNER_TEMP/update-ready.png"
          app/target/release/comms-terminal-app raise
          app/target/release/comms-terminal-app status | tee "$RUNNER_TEMP/update-status.json"
          pkill -f comms-terminal || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: |
            ${{ runner.temp }}/demo.png
            ${{ runner.temp }}/app.log
            ${{ runner.temp }}/update-*.png
            ${{ runner.temp }}/update-status.json
            ${{ runner.temp }}/app-update.log
